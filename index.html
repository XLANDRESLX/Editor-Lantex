    else dlg.setAttribute('open', '');
    refreshIcons();
  }
  function closeDialog(id) {
    const dlg = document.getElementById(id);
    if (!dlg) return;
    if (typeof dlg.close === 'function') { try { dlg.close(); } catch (e) { dlg.removeAttribute('open'); } }
    else dlg.removeAttribute('open');
  }
  function openSettings() {
    document.getElementById('cfgHeader').value = Config.data.pdf.header;
    document.getElementById('cfgFooter').value = Config.data.pdf.footer;
    document.getElementById('cfgFontSize').value = Config.data.fontSize;
    document.getElementById('cfgLineNumbers').checked = Config.data.showLineNumbers;
    openDialog('dlgSettings');
  }
  function bindSettings() {
    const sync = () => {
      Config.data.pdf.header = document.getElementById('cfgHeader').value;
      Config.data.pdf.footer = document.getElementById('cfgFooter').value;
      Config.data.fontSize = document.getElementById('cfgFontSize').value;
      Config.data.showLineNumbers = document.getElementById('cfgLineNumbers').checked;
      Config.save();
      applyConfig();
      const btn = document.querySelector('[data-action="toggle-linenumbers"]');
      if (btn) btn.setAttribute('aria-pressed', String(Config.data.showLineNumbers));
      scheduleRender(80);
    };
    ['cfgHeader', 'cfgFooter', 'cfgFontSize', 'cfgLineNumbers'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('input', sync);
      el.addEventListener('change', sync);
    });
  }

  function applyConfig() {
    document.documentElement.classList.toggle('dark', Config.data.theme === 'dark');
    document.documentElement.style.setProperty('--editor-font-size', Config.data.fontSize);
    updateLineNumbers();
  }

  /* ---------------- Pestañas / responsive / zoom ---------------- */
  function switchTab(tab) {
    currentTab = tab;
    const showEditor = tab === 'editor';
    document.getElementById('panelEditor').style.display = showEditor ? '' : 'none';
    document.getElementById('panelPreview').style.display = showEditor ? 'none' : '';
    document.getElementById('panelPreview').classList.toggle('mt-3', showEditor);
    document.querySelectorAll('[data-action="tab"]').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.tab === tab));
    });
    scheduleFit();
  }

  function isMobile() { return window.matchMedia('(max-width: 639px)').matches; }
  function isDesktop() { return window.matchMedia('(min-width: 1024px)').matches; }

  function toggleSheet(force) {
    const sheet = document.getElementById('bottomSheet');
    if (!isMobile() && force !== false) return;   // la hoja solo existe en móvil
    const scrim = document.getElementById('sheetScrim');
    const open = force !== undefined ? force : !sheet.classList.contains('open');
    sheet.classList.toggle('open', open);
    scrim.classList.toggle('show', open);
    document.querySelectorAll('[data-action="toggle-sheet"]').forEach((b) => b.setAttribute('aria-expanded', String(open)));
  }

  function applyResponsive() {
    const mobile = isMobile();
    document.getElementById('bottomSheet').classList.toggle('hidden', !mobile);
    document.getElementById('sheetScrim').classList.toggle('hidden', !mobile);
    if (!mobile) toggleSheet(false);
    if (isDesktop()) {
      document.getElementById('panelEditor').style.display = '';
      document.getElementById('panelPreview').style.display = '';
    } else {
      switchTab(currentTab);
    }
    scheduleFit();
  }

  /** Reajusta la escala cuando el panel acaba de cambiar de visibilidad. */
  function scheduleFit() {
    fitPages();                          // síncrono: fuerza reflow y mide al instante
    requestAnimationFrame(fitPages);
    setTimeout(fitPages, 140);
  }

  /** Escala la hoja A4 al ancho disponible (<640px y 640–1023px). */
  function fitPages() {
    const naturalW = mm2px(A4.widthMm);                    // 794 px
    const wrapW = pagesWrap.clientWidth;
    if (!wrapW) return;                                    // panel oculto: no forzar escala
    const scale = Util.clamp((wrapW - 20) / naturalW, 0.15, 1);
    pagesEl.style.width = naturalW + 'px';
    pagesEl.style.transform = 'scale(' + scale.toFixed(4) + ')';
    const naturalH = pagesEl.offsetHeight;                 // offsetHeight ignora el transform
    pagesSizer.style.width = (naturalW * scale) + 'px';
    pagesSizer.style.height = (22 + naturalH * scale + 24) + 'px';
    document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
  }

  /* ==========================================================================
     8. RENDER PRINCIPAL: Markdown+LaTeX → HTML → medición → páginas A4
     ========================================================================== */
  function ensureFonts() {
    if (!fontsPromise) fontsPromise = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    return fontsPromise;
  }

  async function render() {
    const token = ++renderToken;
    const segments = Parser.renderDocument(editor.value);

    // 1) Lienzo de medición con EXACTAMENTE el layout de la hoja final
    measureEl.innerHTML = '';
    const mPage = document.createElement('section');
    mPage.className = 'a4-page';
    const mContent = document.createElement('div');
    mContent.className = 'a4-content';
    mPage.appendChild(mContent);
    measureEl.appendChild(mPage);

    // 2) Volcado de los bloques de primer nivel
    const chunks = [];
    segments.forEach((seg) => {
      if (seg.break) {
        const marker = document.createElement('div');
        marker.className = 'pagebreak-marker';
        marker.setAttribute('data-pagebreak', '');
        chunks.push(marker);
        return;
      }
      const holder = document.createElement('div');
      holder.innerHTML = seg.html;
      while (holder.firstChild) {
        const node = holder.firstChild;
        holder.removeChild(node);
        if (node.nodeType === 1) chunks.push(node);
        else if (node.nodeType === 3 && node.data.trim()) {
          const span = document.createElement('span');
          span.appendChild(node);
          chunks.push(span);
        }
      }
    });
    chunks.forEach((n) => mContent.appendChild(n));

    // 3) SVG de KaTeX a px y espera de fuentes antes de medir
    normalizeSvgUnits(mContent);
    await ensureFonts();
    if (token !== renderToken) return;
    MathWrap.run(mContent);          // fórmulas display largas → varias líneas desde "="

    // 4) Medición + paginación real (getBoundingClientRect)
    Paginator.container = mContent;
    Paginator.lineHeight = Util.num(getComputedStyle(mContent).lineHeight, 16) || 16;
    const groups = Paginator.paginate(chunks);
    if (token !== renderToken) return;

    // 5) Pintado de las hojas
    const total = groups.length;
    const pageHeaders = computeHeaders(groups);
    pagesEl.innerHTML = '';
    groups.forEach((nodes, idx) => {
      const page = document.createElement('section');
      page.className = 'a4-page pdf-page' + (idx > 0 ? ' pdf-page-break-before' : '');
      page.setAttribute('data-hdr', pageHeaders[idx] || '');
      const head = document.createElement('div');
      head.className = 'a4-header';
      head.innerHTML = headerHtml(pageHeaders[idx]);
      const content = document.createElement('div');
      content.className = 'a4-content';
      nodes.forEach((n) => content.appendChild(n));
      const foot = document.createElement('div');
      foot.className = 'a4-footer';
      foot.innerHTML = footerHtml(idx, total);
      page.appendChild(head);
      page.appendChild(content);
      page.appendChild(foot);
      pagesEl.appendChild(page);
    });

    // 6) Métricas e indicadores
    const src = editor.value;
    const words = (src.trim().match(/\S+/g) || []).length;
    document.getElementById('statWords').textContent = words + (words === 1 ? ' palabra' : ' palabras');
    document.getElementById('statChars').textContent = src.length + ' caracteres';
    document.getElementById('statLines').textContent = src.split('\n').length + ' líneas';
    document.getElementById('statPages').textContent = total + (total === 1 ? ' página' : ' páginas');
    const err = document.getElementById('statErrors');
    err.classList.toggle('hidden', Parser.errors === 0);
    err.classList.toggle('badge-err', Parser.errors > 0);
    err.textContent = Parser.errors + (Parser.errors === 1 ? ' fórmula con error' : ' fórmulas con error');

    fitPages();
  }

  /* ==========================================================================
     9. ENTRADA / EVENTOS / AUTO-GUARDADO
     ========================================================================== */
  const saveContent = Util.debounce(() => {
    const ok = Store.set('editor-content', editor.value);
    const el = document.getElementById('saveState');
    el.innerHTML = ok
      ? '<i data-lucide="check" class="h-3 w-3"></i><span>Guardado</span>'
      : '<i data-lucide="cloud-off" class="h-3 w-3"></i><span>Sin persistencia</span>';
    refreshIcons();
  }, 400);

  const scheduleRender = Util.debounce(() => {
    render().catch((e) => console.warn('[Editor] render:', e));
  }, 180);

  function onEditorInput() {
    updateLineNumbers();
    saveContent();
    scheduleRender();
  }

  /* Scroll horizontal del editor: barra nativa + deslizador sincronizado */
  function setupHScroll() {
    const bar = document.getElementById('hScroll');
    if (!bar) return;
    let lock = false;
    const sync = () => {
      const max = Math.max(0, editor.scrollWidth - editor.clientWidth);
      bar.classList.toggle('on', max > 2);
      bar.max = String(max);
      if (!lock) bar.value = String(editor.scrollLeft);
    };
    bar.addEventListener('input', () => { lock = true; editor.scrollLeft = +bar.value; lock = false; });
    editor.addEventListener('scroll', sync, { passive: true });
    editor.addEventListener('input', sync);
    editor.addEventListener('keyup', sync);
    window.addEventListener('resize', sync);
    if (window.ResizeObserver) new ResizeObserver(sync).observe(editor);
    setTimeout(sync, 0);
  }

  function bindEvents() {
    setupHScroll();
    // Delegación: cubre toolbar de escritorio, bottom-sheet y diálogos
    document.addEventListener('click', (ev) => {
      const btn = ev.target.closest('[data-action]');
      if (btn) {
        const fn = ACTIONS[btn.dataset.action];
        if (fn) { ev.preventDefault(); fn(btn, ev); return; }
      }
      const sym = ev.target.closest('[data-sym]');
      if (sym) {
        ev.preventDefault();
        let sel = null;
        if (sym.dataset.sel) {
          const parts = sym.dataset.sel.split(',').map(Number);
          sel = [parts[0], parts[1]];
        }
        insertText(sym.dataset.sym, sel);
      }
    });

    document.getElementById('sheetScrim').addEventListener('click', () => toggleSheet(false));

    editor.addEventListener('input', onEditorInput);
    editor.addEventListener('scroll', syncGutterScroll, { passive: true });
    editor.addEventListener('keyup', markCurrentLine);
    editor.addEventListener('click', markCurrentLine);
    editor.addEventListener('keydown', (ev) => {
      if (ev.key === 'Tab') { ev.preventDefault(); insertText('  '); }
      else if ((ev.ctrlKey || ev.metaKey) && ev.shiftKey && ev.key.toLowerCase() === 'c') {
        ev.preventDefault(); ACTIONS['copy-markdown']();
      } else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'b') {
        ev.preventDefault(); ACTIONS.bold();
      } else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'i') {
        ev.preventDefault(); ACTIONS.italic();
      }
    });

    window.addEventListener('resize', Util.debounce(() => {
      applyResponsive();
      scheduleRender(60);
    }, 160));
    window.addEventListener('beforeunload', () => Store.set('editor-content', editor.value));
  }

  /* ==========================================================================
     10. ARRANQUE
     ========================================================================== */
  function init() {
    Config.load();
    buildToolbar(document.getElementById('toolbarHost'));
    buildToolbar(document.getElementById('toolbarHostMobile'));
    buildSymbols(document.getElementById('symbolsHost'));
    buildSymbols(document.getElementById('symbolsHostMobile'));
    bindSettings();
    applyConfig();

    const lnBtn = document.querySelector('[data-action="toggle-linenumbers"]');
    if (lnBtn) lnBtn.setAttribute('aria-pressed', String(Config.data.showLineNumbers));

    const saved = Store.get('editor-content', null);
    editor.value = (saved === null || saved === '') ? DEFAULT_DOC : saved;

    bindEvents();
    refreshIcons();
    applyResponsive();
    updateLineNumbers();
    markCurrentLine();
    render().catch((e) => console.warn('[Editor] render inicial:', e));

    if (!window.katex || !window.marked || !window.html2pdf) {
      console.warn('[Editor] Alguna librería CDN no cargó.');
      toast('No se pudieron cargar todas las librerías CDN.', 'err', 5000);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
